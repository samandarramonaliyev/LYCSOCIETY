[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyc-society"
version = "0.1.0"
description = "Backend for the LYC Society Telegram Mini App"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["apps*", "config*"]
