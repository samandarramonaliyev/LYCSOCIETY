name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lyc_society_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lyc_society_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-fake-django-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_DB_NAME: lyc_society_ci
      DJANGO_DB_TEST_NAME: test_lyc_society_ci
      DJANGO_DB_USER: postgres
      DJANGO_DB_PASSWORD: postgres
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_SSLMODE: disable
      TELEGRAM_BOT_TOKEN: ci-only-fake-telegram-bot-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[audit,production]"
      - name: Django system check
        run: python backend/manage.py check
      - name: Production settings deployment check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-fake-production-secret-key-not-real
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: app.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.com
          DJANGO_CACHE_URL: redis://:fake-cache-password@cache.example.com:6379/0
          DJANGO_CACHE_SOCKET_TIMEOUT_SECONDS: "2"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_TRUST_PROXY_SSL_HEADER: "true"
          DJANGO_HSTS_SECONDS: "86400"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: python backend/manage.py check --deploy
      - name: Check migration consistency
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python backend/manage.py migrate --noinput
      - name: Run backend tests
        run: python backend/manage.py test --noinput
      - name: Audit Python dependencies
        run: python -m pip_audit --local --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run lint
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit
